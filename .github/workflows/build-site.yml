name: Build site
on:
  workflow_dispatch:
  push:
    paths: ["R/**"]

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest'
          use-public-rspm: true
          
      - name: Install Boost Headers
        run:  sudo apt update -y && sudo apt install -y libboost-all-dev
        
      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2
      
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::roxygen2
            any::BH
            any::Rcpp
            any::RcppEigen
            any::pkgdown
          needs: |
            roxygen2
            website
      
      - name: Build site
        run: |
            pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
            setwd("docs"); x <- readLines("index.html"); x[114] <- "<h2 data-toc-skip>Homepage</h2><ul class=\"list-unstyled\"><li><a href=\"https://biomass-dynamic-models.github.io\" class=\"external-link\">BDM-fish</a></li></ul>"; writeLines(x, con = "index.html")
        shell: Rscript {0}
        
      - name: Push site
        uses: cpina/github-action-push-to-another-repository@main
        env:
           API_TOKEN_GITHUB: ${{ secrets.GIT_PAT_TOKEN }}
        with:
          source-directory: "docs"
          target-directory: "docs/bdm"
          destination-github-username: "biomass-dynamic-models"
          destination-repository-name: "biomass-dynamic-models.github.io"
          commit-message: "sync bdm site with io"
          target-branch: main
